<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học HSK — Flashcard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="flashcards" data-navhint='Chạm vào thẻ để xem nghĩa. Đánh dấu "Đã thuộc" để lưu tiến độ.'>

<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Flashcard</span>
        <h1>Học từ vựng</h1>
        <p class="sub">Chạm vào thẻ để lật, rồi tự đánh giá xem bạn đã thuộc từ này chưa.</p>
      </div>
    </div>

    <div class="tabs" id="levelTabs"></div>

    <div class="flash-wrap">
      <div class="flash-progress">
        <span id="progText">0 / 0</span>
        <div class="track"><div class="fill" id="progFill" style="width:0%"></div></div>
        <button class="btn-icon" id="shuffleBtn" title="Xáo trộn">⟲</button>
      </div>

      <div class="flash-body">
        <div class="flashcard" id="flashcard">
          <div class="flashcard-inner">
            <div class="flashcard-face front">
              <span class="pill flash-pos" id="posPill"></span>
              <div class="flash-hanzi" id="hanziText">…</div>
              <div class="flash-pinyin" id="pinyinText"></div>
              <button class="speak-btn lg" id="speakFrontBtn" title="Nghe phát âm">🔊</button>
              <div class="flash-hint">Chạm để xem nghĩa</div>
            </div>
            <div class="flashcard-face back">
              <div class="flash-meaning" id="meaningText"></div>
              <div class="flash-example" id="exampleBox" style="display:none;">
                <div class="ex-cn" id="exampleCn"></div>
                <div class="ex-py" id="examplePy"></div>
                <div class="ex-vi" id="exampleVi"></div>
                <button class="speak-btn on-dark" id="speakExampleBtn" title="Nghe câu ví dụ" style="margin-top:8px;">🔊</button>
              </div>
              <div class="flash-hint">Chạm để quay lại</div>
            </div>
          </div>
        </div>

        <div class="flash-side">
          <button class="btn btn-know btn-block" id="knowBtn">✓ Đã thuộc</button>
          <button class="btn btn-unknow btn-block" id="unknowBtn">✕ Chưa thuộc</button>
          <div class="flash-side-divider"></div>
          <button class="btn btn-ghost btn-block" id="nextBtn">Từ tiếp theo →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNavSlot"></nav>

<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
let vocab, deck = [], idx = 0, currentLevel = 'all', lessonFilter = null;

const params = new URLSearchParams(location.search);
if (params.get('level')) currentLevel = params.get('level');
if (params.get('lesson')) lessonFilter = params.get('lesson');

function buildTabs() {
  if (lessonFilter) {
    document.getElementById('levelTabs').innerHTML = `<span class="pill" id="lessonPill">Đang tải bài học…</span> <button class="tab" id="clearLessonBtn">✕ Bỏ lọc, học tất cả</button>`;
    document.getElementById('clearLessonBtn').addEventListener('click', () => {
      lessonFilter = null;
      history.replaceState(null, '', 'flashcards.html');
      buildTabs();
      buildDeck();
    });
    return;
  }
  const tabs = [{ id: 'all', label: 'Tất cả' }, ...LEVELS.map(l => ({ id: l, label: LEVEL_LABEL[l] }))];
  document.getElementById('levelTabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.id === currentLevel ? 'active' : ''}" data-lv="${t.id}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = btn.dataset.lv;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      buildDeck();
    });
  });
}

async function buildDeck() {
  if (lessonFilter) {
    const lessonsData = await fetch('data/lessons.json').then(r => r.json());
    const lesson = lessonsData.lessons.find(l => l.id === lessonFilter);
    if (lesson) {
      const pill = document.getElementById('lessonPill');
      if (pill) pill.textContent = `${lesson.icon} Bài ${lesson.number}: ${lesson.title_vi}`;
      const words = resolveLessonVocab(lesson, vocab);
      deck = shuffle(words);
      idx = 0;
      render();
      return;
    }
  }
  const words = currentLevel === 'all' ? allWords(vocab) : vocab[currentLevel].map(w => ({ ...w, level: currentLevel }));
  deck = shuffle(words);
  idx = 0;
  render();
}

function render() {
  const card = document.getElementById('flashcard');
  card.classList.remove('flipped');
  const w = deck[idx];
  if (!w) return;
  document.getElementById('hanziText').textContent = w.hanzi;
  document.getElementById('pinyinText').textContent = w.pinyin;
  document.getElementById('meaningText').textContent = shortMeaning(w.meaning, 200);
  document.getElementById('posPill').textContent = LEVEL_LABEL[w.level];
  const exBox = document.getElementById('exampleBox');
  if (w.example && w.example.cn) {
    document.getElementById('exampleCn').textContent = w.example.cn;
    document.getElementById('examplePy').textContent = w.example.py;
    document.getElementById('exampleVi').textContent = w.example.vi;
    exBox.style.display = 'block';
  } else {
    exBox.style.display = 'none';
  }
  document.getElementById('progText').textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById('progFill').style.width = `${((idx + 1) / deck.length) * 100}%`;
}

document.getElementById('flashcard').addEventListener('click', () => {
  document.getElementById('flashcard').classList.toggle('flipped');
});

document.getElementById('speakFrontBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  speakChinese(deck[idx].hanzi);
});
document.getElementById('speakExampleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const ex = deck[idx].example;
  if (ex && ex.cn) speakChinese(ex.cn, 0.8);
});

function nextCard() {
  idx = (idx + 1) % deck.length;
  render();
}

document.getElementById('nextBtn').addEventListener('click', nextCard);
document.getElementById('shuffleBtn').addEventListener('click', buildDeck);

document.getElementById('knowBtn').addEventListener('click', () => {
  markKnown(deck[idx].hanzi, true);
  toast('Đã đánh dấu thuộc ✓');
  nextCard();
});
document.getElementById('unknowBtn').addEventListener('click', () => {
  markKnown(deck[idx].hanzi, false);
  nextCard();
});

async function init() {
  vocab = await loadVocab();
  buildTabs();
  buildDeck();
}
init();
</script>
</body>
</html>
