<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học HSK — Trang chủ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" data-navhint='Dữ liệu lưu ngay trên trình duyệt của bạn — không cần tài khoản, không cần internet sau khi đã tải trang.'>

<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Chào mừng trở lại</span>
        <h1 id="greeting">Học tiếng Trung mỗi ngày</h1>
        <p class="sub">Chọn một hoạt động bên dưới để tiếp tục hành trình chinh phục HSK 1–3 của bạn.</p>
      </div>
      <div class="streak-box" id="streakBox">
        <div class="flame">🔥</div>
        <div>
          <div class="num" id="streakNum">0</div>
          <div class="lbl">ngày liên tiếp</div>
        </div>
      </div>
    </div>

    <div class="grid grid-3" id="levelCards" style="margin-bottom:34px;"></div>

    <div class="card pad-lg" style="margin-bottom:24px;">
      <h3 style="font-size:17px; margin-bottom:16px;">Bắt đầu ngay</h3>
      <div class="grid grid-3">
        <a href="lessons.html" class="btn btn-primary btn-lg btn-block">📖 Học theo Bài học</a>
        <a href="flashcards.html" class="btn btn-outline btn-lg btn-block">Học Flashcard</a>
        <a href="quiz.html" class="btn btn-outline btn-lg btn-block">Làm trắc nghiệm</a>
      </div>
    </div>

    <div class="card pad-lg">
      <h3 style="font-size:17px; margin-bottom:4px;">Từ vựng hôm nay</h3>
      <p style="margin-bottom:18px;">Ba từ ngẫu nhiên để ôn lại trước khi bắt đầu buổi học.</p>
      <div class="grid grid-3" id="dailyWords"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNavSlot"></nav>

<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
async function init() {
  const vocab = await loadVocab();
  const p = getProgress();

  document.getElementById('streakNum').textContent = p.streak.count;

  const hours = new Date().getHours();
  const greet = hours < 11 ? 'Chào buổi sáng ☀️' : hours < 18 ? 'Chào buổi chiều 🌤️' : 'Chào buổi tối 🌙';
  document.getElementById('greeting').textContent = greet + ' — cùng học tiếng Trung nào!';

  const wrap = document.getElementById('levelCards');
  wrap.innerHTML = LEVELS.map(lv => {
    const st = levelStats(vocab, lv);
    return `
      <a href="flashcards.html?level=${lv}" class="level-card ${lv}">
        <div class="tag">Cấp độ</div>
        <h3>${LEVEL_LABEL[lv]}</h3>
        <div class="count">${st.known}/${st.total} từ đã thuộc</div>
        <div class="bar-track"><div class="bar-fill" style="width:${st.pct}%"></div></div>
        <div class="glyph">${lv === 'hsk1' ? '一' : lv === 'hsk2' ? '二' : '三'}</div>
      </a>`;
  }).join('');

  const words = pick(allWords(vocab), 3);
  document.getElementById('dailyWords').innerHTML = words.map((w, i) => `
    <div class="card pad" style="text-align:center;">
      <div style="font-family:var(--font-display); font-size:34px;">${w.hanzi}</div>
      <div style="color:var(--seal); font-weight:700; font-size:13px; margin:4px 0 6px;">${w.pinyin}</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">${shortMeaning(w.meaning)}</div>
      <button class="speak-btn" data-speak-idx="${i}" title="Nghe phát âm">🔊</button>
    </div>
  `).join('');
  document.querySelectorAll('[data-speak-idx]').forEach(btn => {
    btn.addEventListener('click', () => speakChinese(words[btn.dataset.speakIdx].hanzi));
  });
}
init();
</script>
</body>
</html>
