<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học HSK — Luyện viết</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="writing" data-navhint='Đồ theo chữ mờ trong ô "mễ tự cách" — lưới truyền thống giúp căn chỉnh nét chữ Hán.'>

<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Luyện viết</span>
        <h1>Tập viết chữ Hán</h1>
        <p class="sub">Dùng chuột hoặc ngón tay để đồ theo nét chữ mờ trong ô vuông bên dưới.</p>
      </div>
    </div>

    <div class="tabs" id="levelTabs"></div>

    <div class="write-wrap">
      <div class="write-target">
        <div class="hz" id="targetHanzi">…</div>
        <div>
          <div class="py" id="targetPinyin"></div>
          <div class="mn" id="targetMeaning"></div>
        </div>
        <button class="speak-btn" id="writeSpeakBtn" title="Nghe phát âm">🔊</button>
      </div>

      <div class="canvas-box mizi-box" id="canvasBox">
        <div class="diag"></div>
        <div class="guide" id="guideChar"></div>
        <canvas id="drawCanvas"></canvas>
      </div>

      <div class="write-actions">
        <button class="btn btn-ghost" id="clearBtn">↺ Xoá nét vẽ</button>
        <button class="btn btn-outline" id="toggleGuideBtn">Ẩn/hiện chữ mẫu</button>
        <button class="btn btn-primary" id="doneBtn">✓ Xong, từ tiếp theo</button>
      </div>
      <div class="write-count" id="writeCount"></div>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNavSlot"></nav>

<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
let vocab, deck = [], idx = 0, currentLevel = 'all';
let canvas, ctx, drawing = false;

function buildTabs() {
  const tabs = [{ id: 'all', label: 'Tất cả' }, ...LEVELS.map(l => ({ id: l, label: LEVEL_LABEL[l] }))];
  document.getElementById('levelTabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.id === currentLevel ? 'active' : ''}" data-lv="${t.id}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = btn.dataset.lv;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      buildDeck();
    });
  });
}

function buildDeck() {
  const words = currentLevel === 'all' ? allWords(vocab) : vocab[currentLevel].map(w => ({ ...w, level: currentLevel }));
  deck = shuffle(words);
  idx = 0;
  render();
}

function setupCanvas() {
  canvas = document.getElementById('drawCanvas');
  const box = document.getElementById('canvasBox');
  const size = box.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--seal').trim() || '#E24C34';

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  };
  const start = (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = (e) => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
  const end = () => { drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function clearCanvas() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function render() {
  const w = deck[idx];
  if (!w) return;
  document.getElementById('targetHanzi').textContent = w.hanzi;
  document.getElementById('targetPinyin').textContent = w.pinyin;
  document.getElementById('targetMeaning').textContent = shortMeaning(w.meaning);
  document.getElementById('guideChar').textContent = w.hanzi;
  document.getElementById('writeCount').textContent =
    `Đã luyện: ${idx + 1} / ${deck.length} từ trong phiên này`;
  document.getElementById('writeSpeakBtn').onclick = () => speakChinese(w.hanzi);
  clearCanvas();
}

document.getElementById('clearBtn').addEventListener('click', clearCanvas);
document.getElementById('toggleGuideBtn').addEventListener('click', () => {
  const g = document.getElementById('guideChar');
  g.style.visibility = g.style.visibility === 'hidden' ? 'visible' : 'hidden';
});
document.getElementById('doneBtn').addEventListener('click', () => {
  recordWriting(deck[idx].hanzi);
  toast('Đã lưu lượt luyện viết ✓');
  idx = (idx + 1) % deck.length;
  render();
});

window.addEventListener('resize', () => { setupCanvas(); clearCanvas(); });

async function init() {
  vocab = await loadVocab();
  buildTabs();
  buildDeck();
  setupCanvas();
}
init();
</script>
</body>
</html>
