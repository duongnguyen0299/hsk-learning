<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học HSK — Bài học</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lessons" data-navhint='Mỗi bài học gồm Từ mới — Hội thoại — Bài tập, giống cấu trúc giáo trình HSK truyền thống.'>

<div class="app-shell">
  <aside class="sidebar" id="sidebarSlot"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <span class="eyebrow">Giáo trình theo chủ đề</span>
        <h1>Bài học</h1>
        <p class="sub">Học theo từng bài chủ đề thay vì từ vựng rời rạc — mỗi bài có từ mới, hội thoại thực tế và bài tập riêng.</p>
      </div>
    </div>

    <div id="lessonsWrap"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNavSlot"></nav>

<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
async function loadLessons() {
  const res = await fetch('data/lessons.json');
  const data = await res.json();
  return data.lessons;
}

function lessonProgress(lesson) {
  const p = getProgress();
  const hanziList = lessonHanziList(lesson);
  const known = hanziList.filter(h => p.known[h]).length;
  return { known, total: hanziList.length };
}

async function init() {
  const lessons = await loadLessons();
  const byLevel = {};
  lessons.forEach(l => { (byLevel[l.level] = byLevel[l.level] || []).push(l); });

  const wrap = document.getElementById('lessonsWrap');
  wrap.innerHTML = Object.keys(byLevel).map(level => `
    <div style="margin-bottom:36px;">
      <h2 style="font-size:18px; margin-bottom:16px;">${LEVEL_LABEL[level] || level}</h2>
      <div class="lesson-grid">
        ${byLevel[level].map(l => {
          const prog = lessonProgress(l);
          return `
          <a class="lesson-card" href="lesson.html?id=${l.id}">
            <div class="num-badge">Bài ${l.number}</div>
            <div class="icon">${l.icon}</div>
            <h3>${l.title_vi}</h3>
            <div class="cn-title">${l.title_cn}</div>
            <div class="meta">
              <span>📖 ${l.vocab.length} từ mới</span>
              <span>💬 ${l.dialogue.length} câu hội thoại</span>
            </div>
            <div class="bar-track" style="margin-top:10px; background:var(--paper-alt);">
              <div class="bar-fill" style="width:${l.vocab.length ? Math.round(prog.known/l.vocab.length*100) : 0}%; background:var(--jade);"></div>
            </div>
          </a>`;
        }).join('')}
      </div>
    </div>
  `).join('') + `
    <div class="callout" style="max-width:640px;">
      <strong>HSK1 đã hoàn thành!</strong> 22 bài học phủ 100% từ vựng HSK1
      (506/506 từ). Ngoài ra còn có mục <strong>Chuyên ngành: CNTT & Sản
      xuất</strong> ở trên. Tiếp theo sẽ là các bài học HSK2 và HSK3 — đang
      được biên soạn dần.
    </div>
  `;
}
init();
</script>
</body>
</html>
